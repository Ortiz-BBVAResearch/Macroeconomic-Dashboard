<title>Monitor Macro España</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: masthead band → control row (tabs + data status) → per-section grid of chart figures, 2 columns on wide screens, 1 on phones.
   Palette and type follow the BBVA Research explorer (Electric Blue / Serene Blue / Midnight; Source Serif 4 + IBM Plex). */
:root{
  --ground:#F7F8F8; --surface:#ffffff; --surface-2:#EDF2F7; --rule:#D5DEE8; --grid:#E6EBF0;
  --ink:#000519; --muted:#46536D; --faint:#7D8AA0;
  --accent:#001391; --accent-soft:#85C8FF; --on-accent:#ffffff;
  --s1:#1F3FD1; --s2:#D8732A; --s3:#1C9AAB; --s4:#8A86F0;
  --good:#1B7F4B; --good-bg:#E3F4EA; --bad:#B4361F; --bad-bg:#FBE7E2; --neutral-bg:#EDF2F7;
  --flag:#7A6300; --flag-bg:#FFF6C9;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#070E46; --surface:#0E1759; --surface-2:#1A2470; --rule:#2C3780; --grid:#1E2A78;
  --ink:#F7F8F8; --muted:#CAD1D8; --faint:#97A3C6;
  --accent:#85C8FF; --accent-soft:#1A3A8C; --on-accent:#070E46;
  --s1:#3D8DE0; --s2:#CF7C30; --s3:#1FA3AF; --s4:#8E7FEA;
  --good:#7FD8A4; --good-bg:#123D3A; --bad:#FF9C86; --bad-bg:#4A1E2A; --neutral-bg:#1A2470;
  --flag:#FFE761; --flag-bg:#2A2A1A; color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#070E46; --surface:#0E1759; --surface-2:#1A2470; --rule:#2C3780; --grid:#1E2A78;
  --ink:#F7F8F8; --muted:#CAD1D8; --faint:#97A3C6;
  --accent:#85C8FF; --accent-soft:#1A3A8C; --on-accent:#070E46;
  --s1:#3D8DE0; --s2:#CF7C30; --s3:#1FA3AF; --s4:#8E7FEA;
  --good:#7FD8A4; --good-bg:#123D3A; --bad:#FF9C86; --bad-bg:#4A1E2A; --neutral-bg:#1A2470;
  --flag:#FFE761; --flag-bg:#2A2A1A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.mast{background:var(--surface);border-bottom:1px solid var(--rule)}
header.mast .wrap{padding-block:22px 18px;display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end;justify-content:space-between}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(26px,3.4vw,38px);line-height:1.1;margin:0;text-wrap:balance;color:var(--accent)}
.lede{margin:8px 0 0;color:var(--muted);max-width:62ch}
.datactl{display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-width:0}
.btn{font:500 14px/1 var(--sans);padding:10px 16px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:focus-visible,.tabs button:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{font-size:12.5px;color:var(--muted);text-align:right;max-width:46ch}
.stamp{font-family:var(--mono);font-size:12px;color:var(--muted)}
nav.tabsbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--rule)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs button{font:500 14px/1 var(--sans);color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:14px 14px 11px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tabs button:hover{color:var(--ink)}
main .wrap{padding-block:24px 48px}
.sechead{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:baseline;justify-content:space-between;margin-bottom:16px}
h2{font-family:var(--serif);font-weight:600;font-size:24px;margin:0;text-wrap:balance}
h3{font-family:var(--sans);font-weight:600;font-size:15px;margin:0;text-wrap:balance}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{font:500 13px/1 var(--sans);padding:8px 12px;background:none;border:0;border-left:1px solid var(--rule);color:var(--muted);cursor:pointer}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media(max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.fig{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:16px 16px 12px;min-width:0;display:flex;flex-direction:column;gap:8px}
.fig.wide{grid-column:1/-1}
.fig .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.fig .src{font-size:11.5px;color:var(--faint);font-family:var(--mono);margin-top:auto;padding-top:4px;overflow-wrap:anywhere}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.legend i.bar{height:10px;width:10px;border-radius:2px}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--sans);font-size:11px;fill:var(--muted)}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:8px 10px;font-size:12.5px;box-shadow:0 4px 14px rgba(0,5,25,.14);min-width:150px;z-index:3}
.tip b{display:block;font-weight:600;margin-bottom:4px}
.tip div{display:flex;justify-content:space-between;gap:14px;font-variant-numeric:tabular-nums}
.tip i{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:14px 14px 10px;display:flex;flex-direction:column;gap:4px;min-width:0;cursor:pointer;text-align:left;font:inherit;color:inherit}
.kpi:hover{border-color:var(--accent)}
.kpi .lab{font-size:12.5px;color:var(--muted);line-height:1.3;min-height:2.6em}
.kpi .val{font-family:var(--serif);font-weight:600;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--ink)}
.kpi .val small{font-family:var(--sans);font-size:13px;font-weight:500;color:var(--muted);margin-left:3px}
.kpi .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:2px 7px;border-radius:999px;background:var(--neutral-bg);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.flash{background:var(--flag-bg);color:var(--flag)}
.spark{height:34px;width:100%}
/* tables */
.tblwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--rule);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{padding:8px 12px;text-align:right;border-bottom:1px solid var(--grid);white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:220px}
thead th{font-size:12px;font-weight:600;color:var(--muted);background:var(--surface-2);position:sticky;top:0}
tbody tr:hover{background:var(--surface-2)}
tr.grp td{background:var(--ground);font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:12px}
td.src{font-size:12px;color:var(--muted);text-align:left}
td .u{color:var(--faint);font-size:12px;margin-left:4px}
.tblhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:26px 0 10px}
.tblhead:first-child{margin-top:0}
.note{font-size:13px;color:var(--muted);max-width:75ch}
.copyok{font-size:12.5px;color:var(--good);margin-left:8px}
a{color:var(--accent)}
.prose{max-width:72ch}
.prose p,.prose li{color:var(--ink)}
.prose code{font-family:var(--mono);font-size:13px;background:var(--surface-2);padding:1px 5px;border-radius:4px}
.errbox{background:var(--bad-bg);color:var(--bad);border-radius:6px;padding:10px 12px;font-size:13px;margin-bottom:16px}
footer{font-size:12px;color:var(--faint)}
footer .wrap{padding-block:0 32px}
@media(max-width:600px){.datactl{align-items:flex-start}.status{text-align:left}.kpi .val{font-size:26px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="mast"><div class="wrap">
  <div>
    <p class="eyebrow">BBVA Research · Big Data &amp; AI</p>
    <h1>Monitor Macro España</h1>
    <p class="lede">Actividad, empleo, precios, cuentas públicas, sector exterior y condiciones financieras de la economía española, con las series oficiales del INE, el Banco de España y el Ministerio de Economía.</p>
  </div>
  <div class="datactl">
    <button type="button" class="btn" id="refreshBtn">Actualizar datos</button>
    <span class="stamp" id="stamp"></span>
    <span class="status" id="liveMsg" aria-live="polite"></span>
  </div>
</div></header>
<nav class="tabsbar" aria-label="Secciones"><div class="wrap"><div class="tabs" role="tablist" id="tabs"></div></div></nav>
<main><div class="wrap" id="panel" role="tabpanel"></div></main>
<footer><div class="wrap" id="foot"></div></footer>

<script id="embedded-data" type="application/json">__DATA__</script>
<script>
"use strict";
let DATA = JSON.parse(document.getElementById('embedded-data').textContent);
let SOURCE_NOTE = 'datos incrustados en la página';
const S = () => DATA.series;
const state = {tab:'resumen', range:'3a'};
const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const COLORS = ['--s1','--s2','--s3','--s4'];
const fmtN = (v,d=1) => v==null||isNaN(v)?'–':v.toLocaleString('es-ES',{minimumFractionDigits:d,maximumFractionDigits:d,useGrouping:'always'});
function decimals(s){ const u=s.unit; if(u==='pb'||u==='M€'||u==='miles') return 0; if(u==='índice') return 1; if(s.freq==='D'||['%'].includes(u)&&s.block==='financiero') return 2; return 1; }
function fmtDate(d,freq){ const y=d.slice(0,4), m=+d.slice(5,7);
  if(freq==='Q') return 'T'+((m-1)/3+1)+' '+y; if(freq==='D') return (+d.slice(8,10))+' '+MES[m-1]+' '+y; if(freq==='A') return y; return MES[m-1]+' '+y; }
function unitLabel(u){ return {'% a/a':'%','% PIB':'% PIB','pp':'pp','pb':'pb','M€':'M€','miles':'miles','índice':'','saldo':'','%':'%'}[u] ?? u; }
const ts = d => Date.UTC(+d.slice(0,4), +d.slice(5,7)-1, +(d.slice(8,10)||1));
function cutoff(){ const now = lastDateAll(); const y={'1a':1,'3a':3,'5a':5,'10a':10}[state.range]; if(!y) return 0; const d=new Date(now); d.setUTCFullYear(d.getUTCFullYear()-y); return d.getTime(); }
function lastDateAll(){ let m=0; for(const k in S()){ const d=S()[k].data; if(d.length) m=Math.max(m,ts(d[d.length-1][0])); } return m; }

/* -------------------------------------------------------------- chart engine (SVG, one y-axis) */
function niceTicks(lo,hi,n=5){ if(lo===hi){lo-=1;hi+=1;} const span=hi-lo, step0=span/n, p=Math.pow(10,Math.floor(Math.log10(step0))); const f=step0/p; const step=(f<1.5?1:f<3?2:f<7?5:10)*p;
  const a=Math.floor(lo/step)*step, b=Math.ceil(hi/step)*step; const t=[]; for(let v=a; v<=b+step/2; v+=step) t.push(+v.toFixed(10)); return t; }
function timeTicks(t0,t1,w){ const yrs=(t1-t0)/3.156e10; const out=[]; const maxT=Math.max(2,Math.floor(w/80));
  if(yrs>2.2){ const y0=new Date(t0).getUTCFullYear()+1, y1=new Date(t1).getUTCFullYear(); let st=1; while((y1-y0+1)/st>maxT) st++; for(let y=y0;y<=y1;y+=st) out.push([Date.UTC(y,0,1),String(y)]); }
  else { const d=new Date(t0); d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth()+1); const months=[]; while(d.getTime()<=t1){ months.push(d.getTime()); d.setUTCMonth(d.getUTCMonth()+1);} let st=1; while(months.length/st>maxT) st++;
    months.forEach((m,i)=>{ if(i%st===0){const dd=new Date(m); out.push([m, MES[dd.getUTCMonth()]+(dd.getUTCMonth()===0||i===0?' '+dd.getUTCFullYear():'')]);} }); }
  return out; }

function drawChart(host, cfg){
  // cfg: {lines:[{id,name,color}], bars:[{id,name,color}], stack:bool, height, zero, unit, freq, yearOverlay}
  const W = Math.max(280, host.clientWidth), H = cfg.height || (W<500?220:260);
  const padL=44, padR=cfg.endLabels?92:14, padT=10, padB=24;
  const c0 = cutoff();
  const all = [...(cfg.bars||[]), ...(cfg.lines||[])].map(s=>({...s, data:(S()[s.id]?.data||[]).filter(o=>ts(o[0])>=c0)}));
  const pts = all.flatMap(s=>s.data);
  if(!pts.length){ host.innerHTML='<p class="note">Sin datos en este periodo.</p>'; return; }
  let t0=Math.min(...pts.map(o=>ts(o[0]))), t1=Math.max(...pts.map(o=>ts(o[0])));
  const bars = all.filter(s=>(cfg.bars||[]).some(b=>b.id===s.id));
  const lines = all.filter(s=>(cfg.lines||[]).some(b=>b.id===s.id));
  // bar slots: unique dates of bar series
  const barDates=[...new Set(bars.flatMap(s=>s.data.map(o=>o[0])))].sort();
  let slot=0; if(barDates.length){ slot=(t1-t0)/Math.max(1,barDates.length-1); t0-=slot/2; t1+=slot/2; }
  if(t1===t0) t1=t0+1;
  // y extent
  let ys=[]; lines.forEach(s=>s.data.forEach(o=>ys.push(o[1])));
  if(bars.length){ if(cfg.stack){ barDates.forEach(d=>{let p=0,n=0; bars.forEach(s=>{const o=s.data.find(x=>x[0]===d); if(o){ if(o[1]>=0)p+=o[1]; else n+=o[1]; }}); ys.push(p,n);}); } else bars.forEach(s=>s.data.forEach(o=>ys.push(o[1]))); }
  let lo=Math.min(...ys), hi=Math.max(...ys); if(cfg.zero!==false && bars.length){ lo=Math.min(lo,0); hi=Math.max(hi,0); }
  if(cfg.zero===true){ lo=Math.min(lo,0); hi=Math.max(hi,0); }
  const ticks=niceTicks(lo,hi, H<240?4:5); lo=ticks[0]; hi=ticks[ticks.length-1];
  const x=t=>padL+(t-t0)/(t1-t0)*(W-padL-padR), y=v=>padT+(hi-v)/(hi-lo)*(H-padT-padB);
  const grid=css('--grid'), rule=css('--rule'), surf=css('--surface');
  let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${cfg.aria||''}">`;
  ticks.forEach(v=>{ g+=`<line x1="${padL}" x2="${W-padR}" y1="${y(v)}" y2="${y(v)}" stroke="${v===0?rule:grid}" stroke-width="${v===0?1.2:1}"/><text x="${padL-6}" y="${y(v)+3.5}" text-anchor="end">${fmtN(v, Math.abs(ticks[1]-ticks[0])<1?1:0)}</text>`; });
  timeTicks(t0,t1,W-padL-padR).forEach(([t,l])=>{ if(t<t0||t>t1) return; g+=`<line x1="${x(t)}" x2="${x(t)}" y1="${H-padB}" y2="${H-padB+4}" stroke="${rule}"/><text x="${x(t)}" y="${H-6}" text-anchor="middle">${l}</text>`; });
  // bars
  if(bars.length){ const bw=Math.max(2, (x(t0+slot)-x(t0))*(cfg.stack?0.72:0.8)/(cfg.stack?1:bars.length));
    barDates.forEach(d=>{ let p=0,n=0; bars.forEach((s,i)=>{ const o=s.data.find(z=>z[0]===d); if(!o) return; const v=o[1]; let yA,yB;
        if(cfg.stack){ if(v>=0){yA=y(p+v);yB=y(p);p+=v;} else {yA=y(n);yB=y(n+v);n+=v;} }
        else { yA=y(Math.max(0,v)); yB=y(Math.min(0,v)); }
        const cx = cfg.stack? x(ts(d))-bw/2 : x(ts(d))-bw*bars.length/2+i*bw;
        const h=Math.max(1,yB-yA);
        g+=`<rect x="${cx+ (cfg.stack?0:0.5)}" y="${yA}" width="${Math.max(1,bw-(cfg.stack?0:1))}" height="${h}" fill="${css(s.color)}" stroke="${surf}" stroke-width="${cfg.stack?1:0}" rx="${Math.min(2,bw/4)}" opacity="${o[2]?0.55:1}"/>`; }); }); }
  // lines
  const ends=[];
  lines.forEach(s=>{ if(!s.data.length) return; let dpath=''; let prev=null;
    s.data.forEach(o=>{ const X=x(ts(o[0])),Y=y(o[1]); const gap = prev && (ts(o[0])-ts(prev[0])) > ({M:40,Q:100,D:20}[S()[s.id].freq]||40)*864e5; dpath += (dpath&&!gap?'L':'M')+X.toFixed(1)+','+Y.toFixed(1); prev=o; });
    g+=`<path d="${dpath}" fill="none" stroke="${css(s.color)}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const L=s.data[s.data.length-1]; g+=`<circle cx="${x(ts(L[0]))}" cy="${y(L[1])}" r="3.5" fill="${css(s.color)}" stroke="${surf}" stroke-width="2"/>`;
    ends.push({y:y(L[1]), x:x(ts(L[0])), name:s.short||s.name, color:s.color, v:L[1], s}); });
  if(cfg.endLabels){ ends.sort((a,b)=>a.y-b.y); for(let i=1;i<ends.length;i++) if(ends[i].y-ends[i-1].y<13) ends[i].y=ends[i-1].y+13;
    ends.forEach(e=>{ g+=`<text x="${W-padR+8}" y="${e.y+3.5}" style="fill:${css('--ink')};font-weight:500">${fmtN(e.v,decimals(S()[e.s.id]))}</text><text x="${W-padR+8+ (fmtN(e.v,decimals(S()[e.s.id])).length*6.4)+4}" y="${e.y+3.5}">${esc(e.name)}</text>`; }); }
  g+=`<line id="xh" x1="0" x2="0" y1="${padT}" y2="${H-padB}" stroke="${css('--faint')}" stroke-dasharray="3 3" visibility="hidden"/><g id="dots"></g>`;
  g+=`<rect x="${padL}" y="${padT}" width="${W-padL-padR}" height="${H-padT-padB}" fill="transparent" id="hit"/></svg>`;
  host.innerHTML=g+'<div class="tip" hidden></div>';
  // hover
  const svg=host.querySelector('svg'), tip=host.querySelector('.tip'), xh=svg.querySelector('#xh'), dots=svg.querySelector('#dots');
  const dates=[...new Set(all.flatMap(s=>s.data.map(o=>o[0])))].sort(), dts=dates.map(ts);
  const show=ev=>{ const r=svg.getBoundingClientRect(); const px=(ev.clientX-r.left)*W/r.width; const t=t0+(px-padL)/(W-padL-padR)*(t1-t0);
    let bi=0,bd=Infinity; dts.forEach((v,i)=>{const dd=Math.abs(v-t); if(dd<bd){bd=dd;bi=i;}}); const d=dates[bi]; const X=x(dts[bi]);
    xh.setAttribute('x1',X); xh.setAttribute('x2',X); xh.setAttribute('visibility','visible');
    let rows='', dh=''; const fr=S()[all[0].id].freq;
    all.forEach(s=>{ const o=s.data.find(z=>z[0]===d) || (S()[s.id].freq!==fr? lastBefore(s.data,d):null); if(!o) return;
      rows+=`<div><span><i style="background:${css(s.color)}"></i>${esc(s.short||s.name)}</span><span>${fmtN(o[1],decimals(S()[s.id]))}${o[2]?' (avance)':''}</span></div>`;
      if(lines.includes(s)) dh+=`<circle cx="${x(ts(o[0]))}" cy="${y(o[1])}" r="4" fill="${css(s.color)}" stroke="${surf}" stroke-width="2"/>`; });
    dots.innerHTML=dh; tip.innerHTML=`<b>${fmtDate(d,fr)}</b>${rows}`; tip.hidden=false;

  const s=S()[id]; const yrs=[...new Set(s.data.map(o=>o[0].slice(0,4)))].sort().slice(-4);
  const col=['--faint','--s4','--s3','--s1'].slice(-yrs.length);

  const vals=sub.flat().map(o=>o[1]); const ticks=niceTicks(Math.min(0,...vals),Math.max(0,...vals),5); const lo=ticks[0],hi=ticks[ticks.length-1];
  const x=m=>padL+(m-1)/11*(W-padL-padR), y=v=>padT+(hi-v)/(hi-lo)*(H-padT-padB);

  for(let m=1;m<=12;m++) if(W>420||m%2) g+=`<text x="${x(m)}" y="${H-6}" text-anchor="middle">${MES[m-1]}</text>`;

  panel.innerHTML=`<div class="sechead"><h2>Tablas</h2><span class="note">Últimas observaciones por frecuencia. * dato de avance. Copiar CSV pega en Excel con separador punto y coma.</span></div>
   <div class="tblhead"><h3>Trimestral · últimos 8 trimestres</h3><span><button class="btn ghost" type="button" data-copy="q">Copiar CSV</button><span class="copyok" data-ok="q"></span></span></div>${Q.html}
   <div class="tblhead"><h3>Mensual · últimos 12 meses</h3><span><button class="btn ghost" type="button" data-copy="m">Copiar CSV</button><span class="copyok" data-ok="m"></span></span></div>${M.html}
   <div class="tblhead"><h3>Mercados · datos diarios</h3><span><button class="btn ghost" type="button" data-copy="d">Copiar CSV</button><span class="copyok" data-ok="d"></span></span></div>${dh}`;
  panel.querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click',async()=>{ const k=b.dataset.copy, ok=panel.querySelector(`[data-ok="${k}"]`);
    try{ await navigator.clipboard.writeText(tables[k]); ok.textContent='Copiado'; }catch(e){ const ta=document.createElement('textarea'); ta.value=tables[k]; ta.style.width='100%'; ta.rows=6; b.parentNode.after(ta); ta.select(); ok.textContent='Selecciona y copia el texto'; } setTimeout(()=>ok.textContent='',2500); }));
}
function viewFuentes(){
  const m=DATA.meta; const ids=Object.keys(S()).filter(k=>S()[k].block!=='aux');
  const groups={actividad:'Actividad',coyuntura:'Coyuntura',empleo:'Empleo',precios:'Precios',publico:'Sector público',exterior:'Sector exterior',financiero:'Financiero'};
  let h=`<div class="tblwrap"><table><thead><tr><th scope="col">Serie</th><th scope="col" style="text-align:left">Fuente</th><th scope="col" style="text-align:left">Código</th><th scope="col" style="text-align:left">Tratamiento</th><th scope="col">Último dato</th></tr></thead><tbody>`;
  Object.entries(groups).forEach(([g,l])=>{ const sub=ids.filter(k=>S()[k].block===g); if(!sub.length) return; h+=`<tr class="grp"><td colspan="5">${l}</td></tr>`;
    sub.forEach(k=>{ const s=S()[k], L=latest(k); h+=`<tr><td>${esc(s.label)}<span class="u">${esc(s.unit)}</span>${s.original_name?`<div class="note" style="font-size:12px">${esc(s.original_name)}</div>`:''}</td><td class="src">${s.link?`<a href="${esc(s.link)}" target="_blank" rel="noopener">${esc(s.source)}</a>`:esc(s.source)}</td><td class="src">${esc(s.table?s.table+' · ':'')}${esc(s.code)}</td><td class="src" style="white-space:normal;min-width:180px">${esc(s.transform==='yoy'?'% sobre el mismo periodo del año anterior, calculado desde niveles':(s.transform||'serie publicada'))}${s.note?' '+esc(s.note):''}</td><td>${fmtDate(L[0],s.freq)}</td></tr>`; }); });
  h+='</tbody></table></div>';
  panel.innerHTML=`<div class="sechead"><h2>Fuentes y método</h2></div>
  ${m.errors&&m.errors.length?`<div class="errbox">La última actualización no pudo descargar: ${esc(m.errors.join('; '))}. Se muestran los datos anteriores de esas series.</div>`:''}
  <div class="prose">
   <p>Los datos se descargan de tres fuentes públicas sin clave de acceso: la API Tempus3 del <a href="https://www.ine.es/dyngs/DataLab/manual.html?cid=45" target="_blank" rel="noopener">INE</a>, los ficheros CSV del <a href="https://www.bde.es/webbe/es/estadisticas/recursos/descargas-completas.html" target="_blank" rel="noopener">Banco de España</a> y la descarga completa de la base <a href="https://portal.mineco.gob.es/es-es/economiayempresa/EconomiaInformesMacro/Paginas/Dbdsice.aspx" target="_blank" rel="noopener">BDSICE</a> del Ministerio de Economía, Comercio y Empresa, que incluye además series de la IGAE, la TGSS, el SEPE, la Comisión Europea, la OCDE, REE y ANFAC.</p>
   <p>No se estima nada. Las únicas transformaciones son tasas interanuales calculadas desde niveles, sumas móviles de 4 trimestres o 12 meses y cocientes sobre el PIB nominal, indicadas en la tabla. El saldo trimestral de la IGAE se publica acumulado en el año y se desacumula antes de sumar 4 trimestres. Los datos marcados como avance son el indicador adelantado del INE.</p>
   <p>Actualización: el script <code>update_data.py</code> regenera <code>data.json</code>. En GitHub, la acción <code>update-data.yml</code> lo ejecuta dos veces cada día laborable (hacia las 9:15 y las 16:15 en invierno y una hora más tarde en verano, hora de Madrid), reconstruye <code>index.html</code> con los datos incrustados y se puede lanzar a mano desde la pestaña Actions. El botón <b>Actualizar datos</b> relee <code>data.json</code> y la página también lo comprueba cada 15 minutos.</p>
   <p class="stamp">Datos actualizados: ${esc(m.refreshed)} · ${m.n_series} series · origen: ${esc(SOURCE_NOTE)}</p>
  </div>
  <div class="tblhead"><h3>Catálogo de series</h3></div>${h}`;
}

/* -------------------------------------------------------------- shell */
function renderTabs(){ const t=document.getElementById('tabs'); t.innerHTML=TABS.map(x=>`<button type="button" role="tab" id="tab-${x.k}" aria-selected="${x.k===state.tab}" tabindex="${x.k===state.tab?0:-1}" data-k="${x.k}">${x.l}</button>`).join('');
  t.querySelectorAll('button').forEach((b,i,all)=>{ b.addEventListener('click',()=>go(b.dataset.k)); b.addEventListener('keydown',e=>{ if(!['ArrowRight','ArrowLeft'].includes(e.key)) return; e.preventDefault(); const j=(i+(e.key==='ArrowRight'?1:-1)+all.length)%all.length; all[j].focus(); go(all[j].dataset.k); }); });
  const sel=t.querySelector('[aria-selected="true"]'); if(sel) sel.scrollIntoView({block:'nearest',inline:'nearest'}); }
function go(k){ state.tab=k; try{ history.replaceState(null,'','#'+k); }catch(e){ location.hash=k; } render(); window.scrollTo({top:0}); }
function render(){ renderTabs(); panel.setAttribute('aria-labelledby','tab-'+state.tab); if(ro){ro.disconnect();ro=null;}
  if(state.tab==='resumen') viewResumen(); else if(state.tab==='tablas') viewTablas(); else if(state.tab==='fuentes') viewFuentes(); else viewBlock(state.tab);
  document.getElementById('stamp').textContent='Datos: '+DATA.meta.refreshed+' · '+DATA.meta.n_series+' series';
  document.getElementById('foot').innerHTML=`Fuentes: INE, Banco de España y Ministerio de Economía, Comercio y Empresa (BDSICE). Elaboración: BBVA Research. Datos a ${esc(DATA.meta.refreshed)}.`; }

async function reload(manual){
  const msg=document.getElementById('liveMsg'); const before=DATA.meta.refreshed;
  if(manual) msg.textContent='Comprobando data.json…';
  try{ const r=await fetch('data.json',{cache:'no-store'}); if(!r.ok) throw new Error('HTTP '+r.status); const u=await r.json(); if(!u.series||!u.meta) throw new Error('formato');
    if(u.meta.refreshed>=before){ DATA=u; SOURCE_NOTE='data.json de este sitio'; }
    msg.textContent=(DATA.meta.refreshed!==before?'Datos nuevos cargados':'Sin datos nuevos')+' · comprobado a las '+new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
    if(DATA.meta.refreshed!==before) render();
  }catch(e){ if(manual) msg.textContent='No se pudo leer data.json ('+e.message+'). Se muestran los datos incrustados del '+DATA.meta.refreshed+'.'; }
}
document.getElementById('refreshBtn').addEventListener('click',()=>reload(true));
try{ const r=localStorage.getItem('mme-range'); if(r) state.range=r; }catch(e){}
const h0=location.hash.slice(1); if(TABS.some(t=>t.k===h0)) state.tab=h0;
window.addEventListener('hashchange',()=>{ const k=location.hash.slice(1); if(TABS.some(t=>t.k===k)&&k!==state.tab){ state.tab=k; render(); } });
render();
if(location.protocol!=='file:'){ reload(false); setInterval(()=>reload(false),15*60*1000); }
window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>render());
new MutationObserver(()=>render()).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
</script>
