name: Update data

on:
  schedule:
    - cron: '17 8,15 * * 1-5'   # UTC: 09:17 y 16:17 en Madrid en invierno
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Refresh data.json
        run: python update_data.py data.json
      - name: Rebuild index.html
        run: python build_page.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- data.json; then
            git add data.json index.html artifact.html update_log.md
            git commit -m "data: series refreshed $(date -u +%F)"
            git push
          else
            echo "No change in data.json"
          fi
